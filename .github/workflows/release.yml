name: release

# 打 tag 才发布：push 到 v* 时先跑完整测试，通过后才打包并发布 release。
# 任何一步失败，release 都不会被创建或覆盖。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.6.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify:
    name: verify before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: manifest / package shape
        run: node tests/manifest_selftest.mjs

      - name: client bundle and turn-end detection
        run: node tests/client_selftest.mjs

      - name: a hanging resume() must not silence the ring
        run: node tests/audio_stall_selftest.mjs

      - name: preset acoustics
        run: node tests/sound_spectrum_selftest.mjs "$RUNNER_TEMP/presets"

      - name: package
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: ${{ runner.temp }}/*.tgz
          if-no-files-found: error

  publish:
    name: publish release
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: resolve tag and version
        id: meta
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version=$(node -p "require('./package.json').version")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          test "$tag" = "v$version" || { echo "tag $tag does not match package version $version"; exit 1; }

      - name: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/publish-release.mjs \
            --tag "${{ steps.meta.outputs.tag }}" \
            --notes "docs/release-notes.md" \
            --assets dist/*.tgz
